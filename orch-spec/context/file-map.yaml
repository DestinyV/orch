project:
  name: "orch"
  root: "E:/YYWorkSpace/projects/orch"
  language: "TypeScript / Python / Markdown"
  type: "Claude Code Plugin / SDD+TDD Workflow Engine"

entry_points:
  - path: "commands/start-dev.md"
    role: "工作流入口"
  - path: "commands/self-check.md"
    role: "插件自检入口（内部自检命令，不计入业务命令数）"
  - path: "commands/spec-migrate.md"
    role: "规范迁移导入"
  - path: "agents/workflow.md"
    role: "工作流编排 Agent"

key_directories:
  - path: "skills/"
    purpose: "22 个工作流 Skill"
    convention: "每 skill 独立目录，含 SKILL.md + references/ + templates/"
  - path: "agents/"
    purpose: "26 个子代理 Agent"
    convention: "单文件单 agent，含 frontmatter + 角色描述"
  - path: "commands/"
    purpose: "14 个斜杠命令"
    convention: "单文件单命令，含 frontmatter + usage"
  - path: "scripts/hooks/"
    purpose: "钩子实现（session-start/stage-gate/workflow-gate/pre-compact/session-evaluate/cost-tracker/suggest-compact/observe）"
  - path: "scripts/lib/"
    purpose: "工具库（cost-db.js, state-store.js, hook-flags.js, stage-contracts.js, verdict.js, stdin.js）"
  - path: ".claude-plugin/"
    purpose: "插件元数据（plugin.json, marketplace.json）"
  - path: "orch-spec/context/"
    purpose: "项目级上下文注册中心"
  - path: "orch-spec/spec/"
    purpose: "主规范库"

key_files:
  - path: "skills/workflow/SKILL.md"
    purpose: "流程编排引擎（步骤0-9 编排逻辑）"
  - path: "skills/workflow/references/agent-dispatch-code.md"
    purpose: "步骤1-9 Agent 派遣意图与验证"
  - path: "skills/workflow/references/flow-execution-reference.md"
    purpose: "全部阶段输入/输出契约"
  - path: "skills/design/references/table-design-spec.md"
    purpose: "表设计规范（命名/字段/索引/约束/反模式）"
  - path: "scripts/lib/stage-contracts.js"
    purpose: "阶段契约单一事实源（STAGE_ORDER/STAGE_OUTPUTS/SKILL_PREREQUISITES/EXEMPT_*）"
  - path: "scripts/lib/verdict.js"
    purpose: "判定函数（覆盖率/流转率/规则自决）"
  - path: "scripts/self-check.js"
    purpose: "插件 5 块自检（orchestration/agents/skills/tdd_loop/commands_hooks）"
  - path: "~/.claude/orch-costs/usage.db"
    purpose: "成本追踪 SQLite 数据库"
  - path: "~/.claude/orch-instincts/observations.jsonl"
    purpose: "instinct 观察日志（continuous-learning 数据源）"

api_routes: []
